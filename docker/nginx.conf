# limite por IP nas rotas de autenticação (login, registro e refresh)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_status 429;

# DNS interno do Docker, consultado a cada requisição: sem isso o nginx guarda o IP dos serviços
# na subida e devolve 502 depois que um deles é recriado (docker compose up -d --build)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # IP real do cliente atrás de um ALB na VPC: só confia em X-Forwarded-For vindo de faixas privadas.
    # 172.28.0.0/24 é a rede do compose (o gateway dela aparece como origem de conexões locais e
    # de IPv6 repassadas pelo docker-proxy), então a faixa 172.16.0.0/12 é listada sem o 172.28.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/13;
    set_real_ip_from 172.24.0.0/14;
    set_real_ip_from 172.29.0.0/16;
    set_real_ip_from 172.30.0.0/15;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        set $auth_upstream http://auth-service:8081;
        proxy_pass $auth_upstream;
    }

    # WebSocket/STOMP (SockJS). Definir qualquer proxy_set_header aqui descarta os do bloco server,
    # então os headers comuns são repetidos
    location /ws/ {
        set $chat_upstream http://chat-service:8082;
        proxy_pass $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # histórico fica no message-service; o resto de /rooms no chat-service
    location ~ ^/rooms/[^/]+/messages$ {
        set $message_upstream http://message-service:8083;
        proxy_pass $message_upstream;
    }

    location /rooms {
        set $chat_upstream http://chat-service:8082;
        proxy_pass $chat_upstream;
    }

    # os endpoints /actuator dos serviços não são roteados para fora
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
