services:
  postgres:
    image: postgres:16-alpine
    container_name: whisp-postgres
    environment:
      POSTGRES_DB: whisp_auth
      POSTGRES_USER: whisp
      POSTGRES_PASSWORD: whisp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: